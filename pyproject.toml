[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "planemo"
dynamic = ["version", "readme"]
description = "Command-line utilities to assist in building tools for the Galaxy project (http://galaxyproject.org/)."
license = "MIT"
license-files = [
    "LICENSE",
]
authors = [
    { name = "Galaxy Project and Community", email = "galaxy-committers@lists.galaxyproject.org" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Operating System :: POSIX",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Testing",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "allure-python-commons",
    "bioblend>=1.6.0",
    "click!=8.0.2",
    "cryptography>=46.0.3",
    "cwltool>=1.0.20191225192155",
    "ephemeris>=0.10.3",
    "galaxy-job-config-init>=0.1.4",
    "galaxy-tool-util[edam,extended-assertions]>=25.1,<26.2",
    "galaxy-tool-util-models>=25.1,<26.2",
    "galaxy-util[template]>=24.1,<26.2",
    "glob2",
    "gxformat2>=0.25.0",
    "h5py",
    "jinja2",
    "lxml",
    "oyaml",
    "packaging",
    "pathvalidate",
    "pydantic>=2",
    "pyyaml",
    "rich>=12.3.0",
    "ruamel.yaml",
    "virtualenv",
    "tabulate",
]

[tool.setuptools.packages.find]
include = ["planemo", "planemo.*"]
namespaces = false

[tool.setuptools.package-data]
"planemo" = [
    "xml/xsd/repository_dependencies.xsd",
    "xml/xsd/tool_dependencies.xsd",
    "reports/*",
    "scripts/*"
]

[tool.setuptools.dynamic]
version = {attr = "planemo.__version__"}
readme = {file = ["README.rst", "HISTORY.rst"], content-type = "text/x-rst"}

[project.scripts]
planemo = "planemo.cli:planemo"

[tool.black]
extend-exclude = '^/(docs/standards)/'
include = '\.pyi?$'
line-length = 120

[tool.darker]
isort = true

[tool.ruff]
# Match flake8 configuration from setup.cfg
line-length = 120  # Match black configuration
exclude = [
    ".eggs",
    ".git",
    ".tox",
    ".venv",
    "build",
    "docs/conf.py",
    "docs/standards",
    "project_templates/cwl_draft3_spec/",
    "planemo/autopygen/",
    "*.ipynb",
]

[tool.ruff.lint]
# Only enable rules that flake8 would check by default
# This corresponds to the default flake8 ruleset minus ignored codes
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
]
ignore = [
    "E203",  # whitespace before ':' (conflicts with black)
    "E501",  # line too long (managed by black)
    "E701",  # multiple statements on one line (conflicts with black)
]

[tool.ruff.lint.mccabe]
# Match flake8 max-complexity setting
max-complexity = 14

[dependency-groups]
test = [
    "pytest",
    "pytest-timeout",
    "pytest-mock",
    "coverage",
    "responses>=0.23.0",
    "flask",
    "Werkzeug",
]
lint = [
    "black",
    "flake8",
    "isort",
    "ruff",
]
typecheck = [
    "mypy==2.4.0",
    "pyrefly==1.3.2",
    "types-PyYAML",
    "types-python-dateutil",
    "types-requests",
    "types-tabulate",
    "types-psutil",
]
docs = [
    "docutils",
    "sphinx",
    "sphinx_rtd_theme",
    "recommonmark",
]
release = [
    "build",
    "twine",
    "tomlkit>=0.13",
    "packaging",
]
cwl-test = [
    "toil",
]
dev = [
    "tox",
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "typecheck"},
    {include-group = "docs"},
    {include-group = "release"},
    {include-group = "cwl-test"},
]
