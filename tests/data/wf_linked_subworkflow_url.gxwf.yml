class: GalaxyWorkflow
doc: Parent workflow with a subworkflow step linked via run URL
inputs:
  input: data
outputs:
  head_output:
    outputSource: head/outfile
  child_report:
    outputSource: linked subworkflow/child_report
steps:
  head:
    tool_id: toolshed.g2.bx.psu.edu/repos/bgruening/text_processing/tp_head_tool/9.3+galaxy1
    tool_version: 9.3+galaxy1
    tool_shed_repository:
      changeset_revision: ddf54b12c295
      name: text_processing
      owner: bgruening
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      infile: input
  linked subworkflow:
    run: base64:
    in:
      child input: input
