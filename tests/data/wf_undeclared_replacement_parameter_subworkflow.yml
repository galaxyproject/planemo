class: GalaxyWorkflow
inputs:
  - id: input1
outputs:
  - id: wf_output_1
    outputSource: nested/wf_output_1
steps:
  nested:
    run:
      class: GalaxyWorkflow
      inputs:
        - id: input1
      outputs:
        - id: wf_output_1
          outputSource: first_cat/out_file1
      steps:
        first_cat:
          tool_id: cat
          in:
            input1: input1
          out:
            out_file1:
              rename: 'cat on ${undeclared}'
    in:
      input1: input1
